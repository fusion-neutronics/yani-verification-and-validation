name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; queued rather than cancelled so a merge is never
# published over by an older run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the docs toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          # numpy only: build_site.py reads the committed result JSON and needs
          # neither yani nor any nuclear data to turn it into pages.
          pip install numpy matplotlib

      - name: Generate the benchmark pages and figures
        run: python tools/build_site.py

      - name: Build
        run: mkdocs build --strict

      - name: Every benchmark page must carry results
        shell: bash
        run: |
          # A page whose sweep never ran builds and deploys exactly as happily
          # as one that did, and reads as a benchmark yani simply has no
          # numbers for. Fail instead.
          python - <<'EOF'
          import pathlib, sys

          pages = sorted(pathlib.Path("site/benchmarks").glob("*/index.html"))
          if not pages:
              print("::error::no benchmark pages were generated")
              sys.exit(1)

          empty = [p for p in pages if "no results" in p.read_text().lower()]
          for page in empty:
              print(f"::error::{page} has no results in it")
          print(f"{len(pages)} benchmark pages, {len(empty)} without results")
          sys.exit(1 if empty else 0)
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
