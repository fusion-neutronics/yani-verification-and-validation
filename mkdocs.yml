# MkDocs configuration for the YANI verification and validation site.
#
# Every page under docs/benchmarks/ except the index is generated by
# tools/build_site.py from the JSON the sweeps write. Editing one by hand is
# not useful; edit the generator or the benchmark's own prose header instead.
#
# Build: python tools/build_site.py && mkdocs build --strict
site_name: YANI V&V
site_description: YANI verification and validation against open benchmarks
site_url: https://fusion-neutronics.github.io/yani-verification-and-validation/
repo_url: https://github.com/fusion-neutronics/yani-verification-and-validation
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

extra:
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - How the comparisons are made: methodology.md
  - Proposal for a new campaign: proposed-experiments.md
  - Benchmarks:
      - FNS decay heat: benchmarks/fns-decay-heat.md
      - Effective cross sections: benchmarks/effective-cross-sections.md
      - Fission decay heat: benchmarks/fission-decay-heat.md
  - Studies:
      - Self-shielding: studies/self-shielding.md
      - Temperature: studies/temperature.md
      - Group structure: studies/group-structure.md
  - Add a benchmark: contributing.md
